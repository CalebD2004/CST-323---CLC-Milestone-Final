<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body style="background-color:azure; font-family: Roboto;">
    <h1 style="padding-left: 30px; padding-top: 15px; font-family: Roboto;">Welcome to the Orders Page</h1>

    <div style="padding-left: 30px; padding-top: 15px;">
        <button class="button2" type="button" onclick="window.location.href='/'">Back to Home</button>
    </div>

    <br>

    <ul th:each="order : ${orders}" style="list-style-type: none;">
        <li>
            <label for="OrderID"><b>Order ID:</b></label>
            <span th:text="${order.OrderID}" >Order ID</span> <br>

            <br>
            <label for="Associated_Customer"><b>Associated Customer ID:</b></label>
            <span th:text="${order.Associated_Customer}">Associated Customer ID</span> <br>

            <br>
            <label for="Associated_Order_List"><b>Associated Order List ID:</b></label>
            <span th:text="${order.Associated_Order_List}">Associated Order List ID</span> <br>

            <br>
            <label for="Total_Price"><b>Total Price:</b></label>
            <span th:text="'$' +${order.Total_Price}">Total Price</span> <br>

            <br>
            <label for="Delivery_Address"><b>Delivery Address:</b></label>
            <span th:text="${order.Delivery_Address}">Delivery Address</span> <br>

            <br>
            <label for="Payment_Type"><b>Payment Method:</b></label>
            <span th:text="${order.Payment_Type}">Payment Method</span> <br>

            <br>
            <label for="Date_Placed"><b>Order Date:</b></label>
            <span th:text="${order.Date_Placed}">Order Date</span> <br>
        </li>

        <br>
        <form th:action="@{/edit}" method="post">
            <input type="hidden" name="orderId" th:value="${order.OrderID}">
            <button class="button2" type="submit">Edit Order</button>
        </form> <br>

        <form th:action="@{/delete}" method="delete">
            <input type="hidden" name="orderId" th:value="${order.OrderID}">
            <button class="buttonDelete" type="submit">Delete Order</button>
        </form> <br>

        <!-- th:action="@{/delete(orderId=${order.OrderID})}" -->
    </ul>
</body>
</html>
