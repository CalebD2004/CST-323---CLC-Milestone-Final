<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body style="background-color:azure; font-family: Roboto;">
    <h1 style="padding-left: 30px; padding-top: 15px; font-family: Roboto;">Welcome to the Create Page</h1>

    <div style="padding-left: 30px; padding-top: 15px;">
        <button class="button2" type="button" onclick="window.location.href='/'">Back to Home</button> <br>
    </div>

    <br>
    <form th:action="@{/createForm}" th:object="${order}" method="post" style="padding-left: 30px; padding-top: 15px;">

        <label for="Associated_Customer">Associated Customer:</label>
        <input type="number" id="Associated_Customer" name="Associated_Customer" th:field="*{Associated_Customer}" required> <br>

        <br>
        <label for="Associated_Order_List">Associated Order List:</label>
        <input type="number" id="Associated_Order_List" name="Associated_Order_List" th:field="*{Associated_Order_List}" required> <br>

        <br>
        <label for="Total_Price">Total Price:</label>
        <input type="number" step="0.01" id="Total_Price" name="Total_Price" th:field="*{Total_Price}" required> <br>

        <br>
        <label for="Delivery_Address">Delivery Address:</label>
        <input type="text" id="Delivery_Address" name="Delivery_Address" th:field="*{Delivery_Address}" required> <br>

        <br>
        <label for="Payment_Type">Payment Type:</label>
        <input type="text" id="Payment_Type" name="Payment_Type" th:field="*{Payment_Type}" required> <br>

        <br>
        <label for="Date_Placed">Date Placed:</label>
        <input type="date" id="Date_Placed" name="Date_Placed" th:field="*{Date_Placed}" required> <br>

        <br>

        <button class="button2" type="submit">Create New Order</button>
    </form>
</body>
</html>
